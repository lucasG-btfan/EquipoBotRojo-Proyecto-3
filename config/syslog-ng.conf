@version: 3.35

options {
    chain_hostnames(off);
    flush_lines(0);
    use_dns(no);
    use_fqdn(no);
    owner("root");
    group("adm");
    perm(0640);
    stats_freq(0);
    bad_hostname("^gconfd$");
    time_reopen(10);
};

source s_local {
    system();
    internal();
};

source s_network {
    tcp(ip(0.0.0.0) port(1514) max-connections(100));
    udp(ip(0.0.0.0) port(1514));
    tcp(ip(0.0.0.0) port(514) max-connections(100));
    udp(ip(0.0.0.0) port(514));
};

# --- Filtros de facility ---
filter f_auth { facility(auth, authpriv); };
filter f_syslog { facility(syslog); };
filter f_cron { facility(cron); };
filter f_daemon { facility(daemon); };
filter f_kern { facility(kern); };

# --- Filtros de severidad ---
filter f_emerg { level(emerg); };
filter f_alert { level(alert); };
filter f_crit  { level(crit); };

# --- Filtros de detección personalizados ---
filter f_ssh_failed {
    match("Failed password" value("MESSAGE") flags("ignore-case"));
};

filter f_sudo_usage {
    match("sudo" value("PROGRAM") flags("ignore-case")) or
    match("sudo" value("MESSAGE") flags("ignore-case"));
};

filter f_iptables_drop {
    match("iptables.*DROP" value("MESSAGE") type("pcre") flags("ignore-case"));
};

filter f_root_login_attempt {
    match("Failed password for root|Invalid user root|authentication failure.*root" value("MESSAGE") type("pcre") flags("ignore-case"));
};

filter f_port_scan {
    match("DPT=|scan|probe" value("MESSAGE") type("pcre") flags("ignore-case"));
};

filter f_service_restart {
    match("Started" value("MESSAGE") flags("ignore-case"));
};

filter f_access_denied {
    match("Access denied|Permission denied|forbidden" value("MESSAGE") type("pcre") flags("ignore-case"));
};

filter f_kernel_oops {
    match("Oops" value("MESSAGE") flags("ignore-case"));
};

# --- Destinos estándar ---
destination d_auth    { file("/var/log/auth.log"); };
destination d_syslog  { file("/var/log/syslog"); };
destination d_cron    { file("/var/log/cron.log"); };
destination d_daemon  { file("/var/log/daemon.log"); };
destination d_kern    { file("/var/log/kern.log"); };

# --- Destino centralizado (TODOS los logs de red) ---
destination d_centralized {
    file("/var/log/centralized/all.log"
        template("[${ISODATE}] ${HOST} ${PROGRAM}[${PID}]: ${MESSAGE}\n")
        create_dirs(yes)
    );
};

# --- Destinos de seguridad ---
destination d_security_alerts {
    file("/var/log/security/alerts.log"
        template("[${ISODATE}] ${HOST} [ALERT] ${PROGRAM}: ${MESSAGE}\n")
        create_dirs(yes)
    );
};
destination d_iptables_drop {
    file("/var/log/security/iptables_drop.log"
        template("[${ISODATE}] ${HOST} ${MESSAGE}\n")
        create_dirs(yes)
    );
};
destination d_failed_ssh {
    file("/var/log/security/failed_ssh.log"
        template("[${ISODATE}] ${HOST} ${MESSAGE}\n")
        create_dirs(yes)
    );
};

destination d_root_login {
    file("/var/log/security/root_login_attempts.log"
        template("[${ISODATE}] ${HOST} ${MESSAGE}\n")
        create_dirs(yes)
    );
};

destination d_sudo_usage {
    file("/var/log/security/sudo_usage.log"
        template("[${ISODATE}] ${HOST} ${MESSAGE}\n")
        create_dirs(yes)
    );
};

destination d_port_scan {
    file("/var/log/security/port_scan.log"
        template("[${ISODATE}] ${HOST} ${MESSAGE}\n")
        create_dirs(yes)
    );
};

destination d_service_restart {
    file("/var/log/security/service_restart.log"
        template("[${ISODATE}] ${HOST} ${MESSAGE}\n")
        create_dirs(yes)
    );
};

destination d_access_denied {
    file("/var/log/security/access_denied.log"
        template("[${ISODATE}] ${HOST} ${MESSAGE}\n")
        create_dirs(yes)
    );
};

destination d_kernel_oops {
    file("/var/log/security/kernel_oops.log"
        template("[${ISODATE}] ${HOST} ${MESSAGE}\n")
        create_dirs(yes)
    );
};

# ================================================================
# REGLAS DE CONEXIÓN
# IMPORTANTE: El all.log va PRIMERO, sin flags(final), para que
# todos los logs de red queden registrados antes del filtrado.
# ================================================================

# 1. Todo lo que llega por red va al centralizador
log { source(s_network); destination(d_centralized); };

# 2. Logs locales por facility
log { source(s_local); filter(f_auth);   destination(d_auth); };
log { source(s_local); filter(f_syslog); destination(d_syslog); };
log { source(s_local); filter(f_cron);   destination(d_cron); };
log { source(s_local); filter(f_daemon); destination(d_daemon); };
log { source(s_local); filter(f_kern);   destination(d_kern); };

# 3. Logs críticos por severidad — excluimos los que ya tienen regla específica (es decir, kernel oops ya se matchea con otro, no deberia duplicarse)
log { 
    source(s_local); source(s_network); 
    filter(f_emerg); 
    filter { not match("Oops" value("MESSAGE") flags("ignore-case")); };
    destination(d_security_alerts); 
};
log { source(s_local); source(s_network); filter(f_alert); destination(d_security_alerts); };
log { source(s_local); source(s_network); filter(f_crit);  destination(d_security_alerts); };

# 4. Reglas de detección — van a su archivo específico Y a alerts.log
# El orden importa: root_login_attempt ANTES que ssh_failed para evitar colisión
log { source(s_local); source(s_network); filter(f_root_login_attempt); destination(d_root_login);     destination(d_security_alerts); flags(final); };
log { source(s_local); source(s_network); filter(f_ssh_failed);         destination(d_failed_ssh);     destination(d_security_alerts); flags(final); };
log { source(s_local); source(s_network); filter(f_sudo_usage);         destination(d_sudo_usage);     destination(d_security_alerts); flags(final); };
log { source(s_local); source(s_network); filter(f_iptables_drop);      destination(d_iptables_drop);  destination(d_security_alerts); flags(final); };
log { source(s_local); source(s_network); filter(f_port_scan);          destination(d_port_scan);      destination(d_security_alerts); flags(final); };
log { source(s_local); source(s_network); filter(f_access_denied);      destination(d_access_denied);  destination(d_security_alerts); flags(final); };
log { source(s_local); source(s_network); filter(f_service_restart);    destination(d_service_restart); destination(d_security_alerts); flags(final); };
log { source(s_local); source(s_network); filter(f_kernel_oops);        destination(d_kernel_oops);    destination(d_security_alerts); flags(final); };